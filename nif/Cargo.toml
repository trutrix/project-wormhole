[package]
name = "project-wormhole-nif"
version = "0.1.0"
edition = "2021"
description = "NIF file format parser for Project Wormhole"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4.20"
nom-derive = "0.10.1"
serde = "1.0.196"
serde_json = "1.0.114"
simplelog = "0.12.1"
half = { version = "2.3.1", features = ["serde"] }
gltf = { version = "1.4.1", features = ["KHR_materials_pbrSpecularGlossiness", "extras", "extensions"] }
fbxcel = { version = "0.9.0", features = ["writer"] }

project-wormhole-esm = { path = "../esm", version = "0.1.0"  }
project-wormhole-ba2 = { path = "../ba2", version = "0.1.0"  }
project-wormhole-shared = { path = "../shared", version = "0.1.0"  }
zerocopy = "0.8.31"
bytemuck = "1.24.0"
