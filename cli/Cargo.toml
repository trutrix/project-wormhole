[package]
name = "cli"
version = "0.1.0"
edition = "2024"
description = "Command-line interface for Project Wormhole"
license = "GPL-3.0-or-later"
keywords = ["cli", "bethesda"]
categories = ["command-line-utilities"]

[dependencies]
